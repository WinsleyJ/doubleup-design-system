name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens-css-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Bouwt tokens, icons, referentie-CSS en Storybook (in afhankelijkheidsvolgorde)
      - run: pnpm build
      # Naamconventie, contract, contrast (tokens) en token-verwijzingen (CSS)
      - run: pnpm check
      - name: Playwright-browser installeren
        run: pnpm --filter @doubleup/storybook exec playwright install --with-deps chromium
      # axe-core over alle stories × thema's × kleurmodi
      - run: pnpm test:a11y
      - name: Rapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapporten
          path: |
            packages/tokens/dist/reports/
            packages/tokens/dist/docs/
            packages/storybook/storybook-static/a11y-report.md
